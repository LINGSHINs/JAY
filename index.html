<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="知一 - 极简刷题学习平台">
    <meta name="theme-color" content="#667eea">
    <title>知一 - 刷题平台</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-additional.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>知</text></svg>">
</head>
<body>
    <!-- 粒子特效canvas层 -->
    <canvas id="particle-canvas"></canvas>

    <!-- 页面容器 -->
    <div id="app">
        <!-- 顶部导航栏 -->
        <header id="app-header">
            <div class="header-left">
                <div class="logo" data-route="#/">
                    <span class="logo-icon">知</span>
                    <span class="logo-text">知一</span>
                </div>
            </div>
            <div class="header-center">
                <nav class="nav-tabs" id="nav-tabs">
                    <!-- 动态渲染导航标签 -->
                </nav>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="btn-theme" title="切换主题">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <button class="icon-btn" id="btn-sound" title="音效开关">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </button>
                <button class="icon-btn" id="btn-settings" title="设置" data-route="#/settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main id="app-main">
            <!-- 页面内容由JS动态渲染 -->
        </main>

        <!-- 底部状态栏 -->
        <footer id="app-footer">
            <div class="footer-left">
                <span class="footer-item">
                    <span class="footer-label">进度</span>
                    <span class="footer-value" id="footer-progress">0%</span>
                </span>
                <span class="footer-divider"></span>
                <span class="footer-item">
                    <span class="footer-label">已刷</span>
                    <span class="footer-value" id="footer-done">0</span>
                </span>
                <span class="footer-divider"></span>
                <span class="footer-item">
                    <span class="footer-label">错题</span>
                    <span class="footer-value" id="footer-mistakes">0</span>
                </span>
            </div>
            <div class="footer-right">
                <span class="footer-item">
                    <span class="footer-label">总题数</span>
                    <span class="footer-value" id="footer-total">0</span>
                </span>
            </div>
        </footer>
    </div>

    <!-- 消息提示 -->
    <div id="toast-container"></div>

    <!-- 模态框容器 -->
    <div id="modal-container"></div>

    <!-- JS文件引入顺序 -->
    <script src="data/questions.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/quiz-engine.js"></script>
    <script src="js/modes.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/flashcard.js"></script>
    <script src="js/easter-eggs.js"></script>
    <script src="js/compat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
